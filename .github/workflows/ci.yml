name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arah
          POSTGRES_PASSWORD: arah
          POSTGRES_DB: arah_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arah" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://arah:arah@localhost:5432/arah_test
      - name: Migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://arah:arah@localhost:5432/arah_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

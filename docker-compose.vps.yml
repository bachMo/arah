# Déploiement sur un serveur partagé : la base et l'API seulement, exposées par un tunnel ngrok.
# Le site est publié sur Vercel. Aucun port n'est ouvert sur le serveur.
#   docker compose -f docker-compose.vps.yml up -d --build
# Marche à suivre : docs/vps-ngrok.md

name: arah

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TRUST_PROXY: "true"
      LOG_JSON: "true"
      WEB_CONCURRENCY: "1"
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN manquant dans .env}
    command: ["http", "--url=${NGROK_DOMAIN:?NGROK_DOMAIN manquant dans .env}", "api:8000"]
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
